<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Jookide tabel (HTML)</title>

    <style>
        table { border-collapse: collapse; width: 100%; }
        th,td { border: 1px solid #ccc; padding: 6px; text-align: left; }
        th { background: #f0f0f0; }
    </style>
</head>
<body>

<h2>Jookide nimekiri</h2>
<div id="output">Laen andmeid...</div>

<script>
    async function loadXSLT() {
        const xml = await fetch("drinks.xml").then(r => r.text());
        const xsl = await fetch("drinks.xsl").then(r => r.text());

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xml, "text/xml");
        const xslDoc = parser.parseFromString(xsl, "text/xml");

        const xsltProcessor = new XSLTProcessor();
        xsltProcessor.importStylesheet(xslDoc);

        const result = xsltProcessor.transformToFragment(xmlDoc, document);

        document.getElementById("output").innerHTML = "";
        document.getElementById("output").appendChild(result);
    }

    loadXSLT();
</script>

</body>
</html>
